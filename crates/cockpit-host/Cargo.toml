[package]
name = "cockpit-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cockpit_host"
path = "src/lib.rs"

[[bin]]
name = "cockpit"
path = "src/bin/cockpit.rs"

[dependencies]
cockpit-providers = { path = "../cockpit-providers" }
axum.workspace = true
futures-util.workspace = true
clap.workspace = true
cockpit-core = { path = "../cockpit-core" }
cockpit-herdr = { path = "../cockpit-herdr" }
cockpit-protocol = { path = "../cockpit-protocol" }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
base64.workspace = true
percent-encoding.workspace = true
tower.workspace = true
tower-http.workspace = true

[dev-dependencies]
async-trait.workspace = true
