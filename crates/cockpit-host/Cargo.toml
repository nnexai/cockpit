[package]
name = "cockpit-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cockpit_host"
path = "src/lib.rs"

[[bin]]
name = "cockpit"
path = "src/bin/cockpit.rs"

[dependencies]
cockpit-providers = { path = "../cockpit-providers" }
cockpit-secrets = { path = "../cockpit-secrets" }
axum.workspace = true
futures-util.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
clap.workspace = true
cockpit-core = { path = "../cockpit-core" }
cockpit-herdr = { path = "../cockpit-herdr" }
cockpit-protocol = { path = "../cockpit-protocol" }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
base64.workspace = true
percent-encoding.workspace = true
tower.workspace = true
tower-http.workspace = true
fs2.workspace = true
nix.workspace = true
uuid.workspace = true
sha2.workspace = true
time = { version = "=0.3.55", features = ["formatting"] }

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
parking_lot.workspace = true
