[package]
name = "cockpit-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
cockpit-providers = { path = "../crates/cockpit-providers" }
cockpit-secrets = { path = "../crates/cockpit-secrets" }
cockpit-core = { path = "../crates/cockpit-core" }
cockpit-herdr = { path = "../crates/cockpit-herdr" }
cockpit-host = { path = "../crates/cockpit-host" }
cockpit-protocol = { path = "../crates/cockpit-protocol" }
uuid.workspace = true
tauri.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
url.workspace = true
parking_lot.workspace = true
tauri-plugin-opener = "=2.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"] }
