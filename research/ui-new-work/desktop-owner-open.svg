<!-- end -->

<text x="24" y="926" font-size="13" font-weight="600" fill="#cdd6f4">Desktop, Owner list open: two same-named owners stay distinguishable and both stay selectable</text>
<text x="24" y="946" font-size="12" fill="#a6adc8">Option text = name · …root-id tail (only when names collide) · state word · where. The state is a word, never colour or glyph alone. Groups: Available / Not confirmed (starting, not running, status unknown).</text>
<text x="24" y="964" font-size="12" fill="#a6adc8">Native &lt;select&gt; with &lt;optgroup&gt; renders text only: the round glyphs and the "selected" label here are illustrative (a custom listbox would be needed to show them). Value stays root_id, so routing is unchanged.</text>
<text x="24" y="982" font-size="12" fill="#a6adc8">After closing, a detail line under the field shows harness · kind · stage · undelivered and the full root id (monospace, selectable); the unknown owner adds its status glyph and note.</text>
