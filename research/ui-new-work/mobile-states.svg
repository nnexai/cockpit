<text x="24" y="904" font-size="12" font-weight="600" fill="#cdd6f4">1 · Empty, 390x844</text>
<text x="24" y="922">Back (44px, focus lands here on open), owner, request,</text>
<text x="24" y="938">Start inside the request box (40px), Context collapsed.</text>
<text x="24" y="954">Hint line is hidden on touch (existing hover:none rule).</text>
<text x="438" y="904" font-size="12" font-weight="600" fill="#cdd6f4">2 · Populated, Context open</text>
<text x="438" y="922">Fields stack at 44px. Open Context keeps "· set" and</text>
<text x="438" y="938">the statement of what is sent. Page scrolls; Start stays</text>
<text x="438" y="954">in the request box, so the keyboard never covers it.</text>
<text x="852" y="904" font-size="12" font-weight="600" fill="#cdd6f4">3 · Owner picker (platform sheet)</text>
<text x="852" y="922">Native select: option text wraps, grouped Available /</text>
<text x="852" y="938">Not confirmed. Same names, different tails and states.</text>
<text x="852" y="954">Sheet drawn for illustration; the OS renders the real one.</text>
<text x="1266" y="904" font-size="12" font-weight="600" fill="#cdd6f4">4 · Unknown owner, failed delivery</text>
<text x="1266" y="922">Owner, request, Context disabled while pending. Detail</text>
<text x="1266" y="938">line wraps; the root id sits on its own line. Notes keep</text>
<text x="1266" y="954">DOM order: owner note, delivery alert, request.</text>
