<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1010" viewBox="0 0 1440 1010" font-family="IBM Plex Sans, Noto Sans, Liberation Sans, Arial, sans-serif">
