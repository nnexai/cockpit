<path id="user" d="M11 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM3 21a8 8 0 0 1 16 0"/>
<path id="down" d="m6 9 6 6 6-6"/>
<path id="right" d="m9 5 7 7-7 7"/>
<path id="send" d="M21 3L10 14 M21 3l-7 18-4-7-7-4z"/>
<path id="cc" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M8 12.3l2.7 2.7L16 9.5"/>
