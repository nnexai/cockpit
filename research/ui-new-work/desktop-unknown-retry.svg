<path id="alert" d="M12 4l9 16H3z M12 10v4 M12 17h.01"/>
<path id="check" d="m4 12 5 5L20 6"/>
</defs>
<rect width="1440" height="1010" fill="#080a0d"/>
<rect width="1440" height="900" fill="#0b0e12"/>

<rect width="1440" height="32" fill="#121923"/><line x1="0" y1="32.5" x2="1440" y2="32.5" stroke="#2b3543"/>
<use href="#grid" transform="translate(14 9) scale(.6667)" fill="none" stroke="#bac2de" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="20.5" font-size="12" fill="#bac2de">Workbench</text>
<rect x="104" y="0" width="82" height="32" fill="#23354c"/><rect x="104" y="0" width="82" height="2" fill="#89b4fa"/>
<use href="#comment" transform="translate(115 9) scale(.6667)" fill="none" stroke="#cdd6f4" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="137" y="20.5" font-size="12" fill="#cdd6f4">Inbox</text>

<rect x="0" y="33" width="340" height="867" fill="#11161e"/><line x1="340.5" y1="33" x2="340.5" y2="900" stroke="#2b3543"/>
<line x1="0" y1="65.5" x2="340" y2="65.5" stroke="#2b3543"/>
<text x="14" y="54" font-size="13" font-weight="500" fill="#bac2de">inbox</text>
<rect x="238.500" y="37.500" width="94" height="24" rx="4" fill="none" stroke="#3b4758"/>
<use href="#plus" transform="translate(245 42.500) scale(.5833)" fill="none" stroke="#bac2de" stroke-width="2.57" stroke-linecap="round"/>
<text x="264" y="53" font-size="12" font-weight="500" fill="#bac2de">New work</text>
<use href="#cc" transform="translate(14 77) scale(.6667)" fill="none" stroke="#94e2d5" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38" y="91" font-size="14" fill="#a6adc8">Nothing needs you right now.</text>
<line x1="0" y1="105.5" x2="340" y2="105.5" stroke="#2b3543"/>
<use href="#right" transform="translate(14 121) scale(.5)" fill="none" stroke="#a6adc8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="35" y="132" font-size="13" fill="#a6adc8">Handled · 13</text>
<use href="#right" transform="translate(14 165) scale(.5)" fill="none" stroke="#a6adc8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="35" y="176" font-size="13" fill="#a6adc8">Other agents · 7</text>

<circle cx="546" cy="96" r="15.500" fill="#89b4fa" fill-opacity=".14" stroke="#89b4fa" stroke-opacity=".42"/>
<use href="#plus" transform="translate(537 87) scale(.75)" fill="none" stroke="#89b4fa" stroke-width="2" stroke-linecap="round"/>
<text x="578" y="95" font-size="20" font-weight="600" fill="#cdd6f4">New work</text>
<text x="578" y="114" font-size="12.500" fill="#a6adc8">Send a request to a liaison.</text>

<!-- owner: unknown root selected, field disabled while the request is pending -->
<text x="530" y="160" font-size="12" font-weight="500" fill="#a6adc8">Owner</text>
<g opacity=".5">
<rect x="530.500" y="168.500" width="719" height="36" rx="4" fill="#161d27" stroke="#3b4758"/>
<use href="#user" transform="translate(542 178) scale(.5833)" fill="none" stroke="#a6adc8" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="191" font-size="13" fill="#bac2de">Supervisor · …9c3e · status unknown · no live terminal</text>
<use href="#down" transform="translate(1226 180) scale(.5)" fill="none" stroke="#a6adc8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="537" cy="220" r="6.500" fill="#a6adc8" fill-opacity=".16" stroke="#a6adc8" stroke-opacity=".5"/>
<text x="537" y="223.500" font-size="9.500" font-weight="700" text-anchor="middle" fill="#a6adc8">?</text>
<text x="550" y="224" font-size="12" fill="#a6adc8">omp · supervisor · closed · 2 undelivered · root</text>
<text x="818" y="224" font-size="11" font-family="IosevkaTerm Nerd Font Mono, IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#a6adc8">6b1e0c4a-5d7f-4e21-8a90-3f2d77c19c3e</text>

<!-- unknown-owner note: same notice pattern as .inbox-note, status tone -->
<rect x="530" y="236" width="720" height="48" rx="4" fill="#f9e2af" fill-opacity=".09"/><rect x="530" y="236" width="2" height="48" fill="#f9e2af"/>
<use href="#alert" transform="translate(544 245) scale(.5833)" fill="none" stroke="#f9e2af" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="254" font-size="12.500" fill="#bac2de">Status unknown. This owner was not found on the current endpoint.</text>
<text x="566" y="272" font-size="12.500" fill="#bac2de">You can still address it, but Cockpit cannot confirm it will read the request.</text>

<!-- failed delivery alert -->
<rect x="530" y="294" width="720" height="48" rx="4" fill="#f38ba8" fill-opacity=".09"/><rect x="530" y="294" width="2" height="48" fill="#f38ba8"/>
<use href="#alert" transform="translate(544 303) scale(.5833)" fill="none" stroke="#f38ba8" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="312" font-size="12.500" fill="#bac2de">Delivery was not confirmed. The original request is retained; retry it without</text>
<text x="566" y="330" font-size="12.500" fill="#bac2de">changing its identity.</text>

<text x="530" y="372" font-size="12" font-weight="500" fill="#a6adc8">Your request</text>
<rect x="530.500" y="380.500" width="719" height="224" rx="4" fill="#161d27" stroke="#3b4758"/>
<path d="M530 383a3 3 0 0 1 3-3h714a3 3 0 0 1 3 3" fill="none" stroke="#89b4fa" stroke-width="2"/>
<g opacity=".5">
<text x="546" y="412" font-size="16" fill="#cdd6f4">Fix the Inbox New work form so Start sits inside the request box.</text>
<text x="546" y="436" font-size="16" fill="#cdd6f4">Keep the owner choice, the context fields and drafts exactly as they are.</text>
</g>
<line x1="531" y1="560.500" x2="1249" y2="560.500" stroke="#2b3543"/>
<text x="546" y="587" font-size="11" fill="#a6adc8">Enter to send · Shift+Enter for a new line</text>
<rect x="1046.500" y="566.500" width="191" height="32" rx="4" fill="none" stroke="#f9e2af"/>
<text x="1142" y="587" font-size="13" font-weight="700" text-anchor="middle" fill="#f9e2af">Retry original request</text>

<g opacity=".5">
<use href="#down" transform="translate(530 634) scale(.5)" fill="none" stroke="#bac2de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="645" font-size="13" font-weight="600" fill="#bac2de">Context · optional · set</text>
<rect x="530.500" y="666.500" width="15" height="15" rx="3" fill="#89b4fa" stroke="#89b4fa"/>
<use href="#check" transform="translate(532 668) scale(.5)" fill="none" stroke="#0b0e12" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="554" y="679" font-size="13" fill="#bac2de">Attach current Space</text>
<rect x="685.500" y="665.500" width="42" height="18" rx="9" fill="none" stroke="#3b4758"/>
<text x="706.500" y="678" font-size="11" text-anchor="middle" fill="#a6adc8">todo</text>
<text x="530" y="708" font-size="12" fill="#a6adc8">Repository ID</text>
<rect x="530.500" y="714.500" width="231" height="32" rx="4" fill="#161d27" stroke="#3b4758"/>
<text x="542" y="735" font-size="14" fill="#cdd6f4">cockpit</text>
<text x="774" y="708" font-size="12" fill="#a6adc8">Branch</text>
<rect x="774.500" y="714.500" width="231" height="32" rx="4" fill="#161d27" stroke="#3b4758"/>
<text x="1018" y="708" font-size="12" fill="#a6adc8">Base ref</text>
<rect x="1018.500" y="714.500" width="231" height="32" rx="4" fill="#161d27" stroke="#3b4758"/>
</g>

<text x="24" y="926" font-size="13" font-weight="600" fill="#cdd6f4">Desktop, unknown-status owner selected and a failed delivery awaiting retry</text>
<text x="24" y="946" font-size="12" fill="#a6adc8">Owner, request and Context are disabled while a request is pending (unchanged). Order: owner field + its detail line + owner note, then the delivery alert, then the request.</text>
<text x="24" y="964" font-size="12" fill="#a6adc8">The unknown owner stays selectable and sendable; the note says what is not known. Copy for the note is a proposal; the endpoint explanation is [INFERENCE] until checked against the owner data.</text>
<text x="24" y="982" font-size="12" fill="#a6adc8">The full root id (monospace) is the unambiguous identity of the root; the …9c3e tail in the option is its last four characters and comes right after the name so truncation never hides it.</text>
</svg>
