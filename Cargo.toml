[workspace]
members = [
    "crates/cockpit-protocol",
    "crates/cockpit-core",
    "crates/cockpit-herdr",
    "crates/cockpit-host",
    "src-tauri",
]
default-members = [
    "crates/cockpit-protocol",
    "crates/cockpit-core",
    "crates/cockpit-herdr",
    "crates/cockpit-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
ts-rs = "=12.0.1"
percent-encoding = "2"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
bincode = { version = "2", features = ["serde"] }

tauri = "=2.11.5"
tauri-build = "=2.6.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
