<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit · four polish studies</title>
<link rel="stylesheet" href="study.css">
</head>
<body>
<div class="study">
<header class="study-bar"><div class="study-title" title="Visual prototypes only. No live actions.">Design studies</div><nav class="switches themes" aria-label="Design variation"></nav><nav class="switches scenes" aria-label="Preview scene"><button data-scene="review">Review</button><button data-scene="files">Files</button><button data-scene="workspace">New workspace</button></nav><button id="original-toggle" aria-pressed="false">Show original</button></header>
<div class="viewport"><main class="artboard" id="artboard" data-theme="graphite" aria-label="Cockpit visual design preview"></main></div>
</div>
<script>
const designs={graphite:{name:'01 Graphite',description:'Familiar edge selection and quieter controls.'},precision:{name:'02 Precision',description:'Neutral surfaces, clear rules and a side-step form.'},slate:{name:'03 Slate',description:'Inset selection and grouped controls.'},warm:{name:'04 Warm',description:'Low-chroma surfaces and flat text actions.'}};
const params=new URLSearchParams(location.search);let theme=Object.hasOwn(designs,params.get('theme'))?params.get('theme'):'graphite';let scene=['review','files','workspace'].includes(params.get('scene'))?params.get('scene'):'review';let step=0;let source=false;let selectedFile=0;let original=false;let taskName='';let query='';let dialogOpen=scene==='workspace';let returnFocus=null;
const artboard=document.querySelector('#artboard');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function spaces(){return `<div class="rail-heading">spaces<button data-action="open" aria-label="Set up a task Space" title="Set up a task Space">+</button></div><div class="space"><span class="state">○</span><span class="label">system</span></div><div class="space"><span class="state">·</span><span class="label">lilygo-t3<small>main</small></span><span class="chev">⌄</span></div><div class="space child"><span class="state">·</span><span>brave-forest-7518</span></div><div class="space child"><span class="state">·</span><span>brave-stone-13f0</span></div><div class="space"><span class="state">·</span><span>~</span></div><div class="space active"><span class="state working">◐</span><span class="label">cockpit<small>main</small></span><span class="chev">⌄</span></div><div class="space child"><span class="state">○</span><span>feat/gui-ideas</span></div>`}
function rail(){return `<aside class="rail">${spaces()}<div class="agents"><div class="rail-heading">agents</div>${[['cockpit · secondary','codex'],['gui-ideas · 1','omp'],['cockpit · main','omp'],['cockpit · meta','omp'],['system · 1','omp']].map(([n,p],i)=>`<div class="agent ${i===0?'selected':''}"><span class="state" role="img" aria-label="${i===0?'Working':'Idle'}" title="${i===0?'Working':'Idle'}">${i===0?'◐':'○'}</span><strong>${n}</strong><small>${p}</small></div>`).join('')}</div></aside>`}
function tabs(){return `<div class="tabs">${['main','secondary','meta','',''].map((n,i)=>`<div class="tab ${(scene==='files'?i===4:i===1)?'active':''}"><span class="number">${i+1}</span>${n}</div>`).join('')}<button class="tab" disabled title="Static tab preview">+</button><div class="right"><button disabled title="Live pane actions are not part of this study">Pane</button><button disabled title="Live commands are not part of this study">Commands</button></div></div>`}
const codeSamples=[[
'  });','', '  it("waits for an explicit branch base submission', '    without requesting blank or partial refs", async () => {','    const host = document.createElement("div");','    document.body.append(host);','    const mounted = createRoot(host);','    const load = vi.fn(async (_request: unknown,','      _signal?: AbortSignal) => snapshot);','    await act(async () => {','      mounted.render(<ReviewPane identity="review"','        sessionId="session" paneId="pane"','        bindingId="binding" repositoryId="repo"','        load={load} file={async () => diff}/>);','    });','    load.mockClear();','    const mode = host.querySelector<HTMLSelectElement>','      ("select[aria-label=Comparison]");','    await act(async () => {','      mode.value = "branch";','      mode.dispatchEvent(new Event("change",','        { bubbles: true }));','    });','    expect(load).not.toHaveBeenCalled();','    const input = host.querySelector<HTMLInputElement>','      (".review-base-input");','    input.focus();','    await act(async () => {','      setInputValue(input, "main");','      input.dispatchEvent(new Event("input",','        { bubbles: true }));','    });','    expect(load).not.toHaveBeenCalled();','    expect(document.activeElement).toBe(input);','    await act(async () => {','      input.dispatchEvent(new KeyboardEvent("keydown",','        { key: "Enter", bubbles: true }));','    });','    expect(load).toHaveBeenCalledTimes(1);','  });'
],['export function ReviewPane(props: ReviewPaneProps) {','  const [mode, setMode] = useState("all");','  const [baseRef, setBaseRef] = useState("");','  const [submittedBase, setSubmittedBase] = useState("");','','  function submitComparison() {','    const base = baseRef.trim();','    if (mode === "branch" && !base) return;','    setSubmittedBase(base);','    refresh({ mode, base });','  }','','  return (','    <section className="review-pane">','      <ComparisonToolbar','        mode={mode}','        baseRef={baseRef}','        onChange={setBaseRef}','        onSubmit={submitComparison}','      />','      <ReviewViewer snapshot={snapshot} />','    </section>','  );','}']];
function review(){return `<img class="terminal-reference" src="assets/terminal.png" alt="Unmodified agent terminal from the supplied screenshot"><section class="pane review-pane" aria-label="Review pane"><div class="pane-title">reviewr</div><div class="toolbar"><select aria-label="Comparison" disabled title="Static comparison scope"><option>All local changes</option></select><div class="group">${['←','→','↑','↓'].map(x=>`<button class="control quiet" disabled title="Static navigation preview">${x}</button>`).join('')}</div><span class="spacer"></span><button class="control quiet" data-action="refresh">Refresh</button></div><div class="review-tree"><div class="minihead">Changed files <span>2</span></div><div class="tree-folder">⌄ src/app/review/</div>${['ReviewPane.test.tsx','ReviewPane.tsx'].map((f,i)=>`<button class="file-row ${selectedFile===i?'selected':''}" data-file="${i}"><span class="status">M</span>${f}<span class="change">+${i?'17 −4':'29'}</span></button>`).join('')}</div><div class="diff"><div class="diff-tools"><button disabled title="Static source expansion preview">Expand full source</button><span>new side</span><div class="source-actions"><button disabled title="Static source preview">Old source</button><button disabled title="Static source preview">New source</button></div></div><div class="diff-path">${selectedFile?'ReviewPane.tsx':'ReviewPane.test.tsx'}<span>unstaged modified</span></div><div class="hunk">@@ −180 +180 @@</div><div class="code-lines">${codeSamples[selectedFile].map((line,i)=>`<div class="code-line ${i>1?'added':''}"><span class="ln">${i<2?180+i:''}</span><span class="ln">${180+i}</span><span class="sign">${i>1?'+':''}</span><span class="code">${esc(line)}</span></div>`).join('')}</div></div><div class="pane-footer"><span>Select a line</span><span>C comment</span><span>Shift+C file</span><span>0 comments</span><span>Alt+↑↓ hunk</span></div></section>`}
const filenames=['.agents','.omp','crates','dist','node_modules','planning','quality','research','scripts','src','src-tauri','target','.editorconfig','.gitignore','BOOTSTRAP_PLAN.md','CODE_GUIDE.md','CONTEXT.md','Cargo.lock','Cargo.toml','DECISIONS.md','IMPLEMENTATION_HANDOFF.md','NEXT_PHASE_PLAN.md','bun.lock','index.html','package.json','rust-toolchain.toml','tsconfig.json','vite.config.ts'];
const documentHTML=`<h1>Cockpit Architecture Context</h1><p><span class="muted">Status: architecture reference.</span> The Herdr client, reviewed worktree setup, companion association, and bounded graphical Context source/Markdown browsing are implemented. Media rendering, reference comments/paste, repository snapshots, source ingestion, and graphical review remain planned in <code>planning/next-level/README.md</code>. Verified delivery boundaries are recorded in <code>DECISIONS.md</code>.</p><p>All filesystem roots, executable locations, Herdr endpoints, and provider settings are configurable. Example absolute paths are intentionally omitted.</p><h2>1. Product vision</h2><p>Cockpit is a personal, local-first developer cockpit for supervising persistent coding-agent sessions and organizing the context needed to work on bounded engineering tasks.</p><p>The product is optimized for one developer on a trusted workstation. It is not a multi-tenant service and does not make coding agents autonomous background operators.</p><p>Cockpit follows conventional engineering workflows:</p><ul><li>discover a local repository;</li><li>create or open a task worktree;</li><li>attach a companion context directory;</li><li>supervise persistent Herdr sessions and agent terminals;</li><li>gather static issue, review, wiki, and telemetry context;</li><li>inspect, test, and review changes locally;</li><li>destroy owned workspace resources when the task is complete.</li></ul><p>Cockpit is intended to become the developer's primary way of engaging with local projects. Maintainable code and easy behavior changes matter more than distribution or product generality.</p><h2>2. Product domains</h2><p>Cockpit remains one umbrella product with provider-neutral domains:</p><ul><li><strong>Forge</strong> covers repositories, branches, pull/merge requests, review material, and worktree provenance.</li><li><strong>Issue Tracker</strong> covers issues, comments, labels, parent relationships, references, and freshness checks.</li><li><strong>Wiki</strong> covers pages and related documentation fetched as static context.</li><li><strong>Telemetry</strong> is optional static log and trace context when a provider adapter is added.</li><li><strong>Herdr Client</strong> is a richer graphical client for Herdr sessions, intended to feel like the native TUI.</li></ul><h2>3. Runtime architecture</h2><h3>3.1 Shared core</h3><p>The reusable Cockpit core and CLI are implemented in Rust. Herdr owns the live session and pane layout.</p>`;
function files(){return `<section class="pane file-pane" aria-label="File pane"><div class="toolbar"><strong>cockpit</strong><span class="badge">Read-only</span><span class="spacer"></span><button class="control quiet" data-action="refresh">Refresh</button><button class="control" disabled title="Terminal switching is not connected in this study">Show terminal</button></div><div class="notice"><span>Repository discovery entry limit reached</span><button data-action="diagnostics">Details</button></div><div class="file-tree"><div class="minihead">Files <span>cockpit</span></div>${filenames.map((f,i)=>`<div class="file-row ${f==='CONTEXT.md'?'selected':''}" title="${f}"><span>${i<12?'›':'·'}</span><span style="overflow:hidden;text-overflow:ellipsis">${f}</span>${i>11?`<span class="size">${i===16?'24785 B':i%2?'1395 B':'208 B'}</span>`:''}</div>`).join('')}</div><div class="document"><div class="document-top">CONTEXT.md <span title="revision 54:14451526:24785:1788612505990449482">24785 B</span></div><div class="document-actions"><button class="control ${source?'chosen':''}" data-action="source">Source</button><button class="control ${!source?'chosen':''}" data-action="markdown">Markdown</button></div>${source?`<div class="source-content">${esc('# Cockpit Architecture Context\n\nStatus: architecture reference.\n\n## 1. Product vision\n\nCockpit is a personal, local-first developer cockpit for supervising persistent coding-agent sessions and organizing the context needed to work on bounded engineering tasks.\n\nThe product is optimized for one developer on a trusted workstation.\n\nCockpit follows conventional engineering workflows:\n\n- discover a local repository;\n- create or open a task worktree;\n- attach a companion context directory;\n- supervise persistent Herdr sessions and agent terminals;\n- gather static issue, review, wiki, and telemetry context;\n- inspect, test, and review changes locally;\n- destroy owned workspace resources when the task is complete.\n\n## 2. Product domains\n\nForge, Issue Tracker, Wiki, Telemetry, and Herdr Client.\n\n## 3. Runtime architecture\n\nThe reusable Cockpit core and CLI are implemented in Rust.')}</div>`:`<article>${documentHTML}</article>`}</div><div class="pane-footer"><span>Select a line</span><span>C comment</span><span>Shift+C file</span><span>0 comments</span></div></section>`}
function repositoryStep(){return `<label class="field"><span>Search repositories</span><input id="repo-search" placeholder="Name, path, or repository ID" value="${esc(query)}" autocomplete="off"></label><div id="repo-result">${repoResult()}</div><label class="field"><span>Task name <em>optional</em></span><input id="task-name" placeholder="Short task description" value="${esc(taskName)}"></label><details><summary>Configured roots</summary><p>Repositories <code>/home/nnex/dev/prj/cockpit</code><br>Worktrees <code>~/.local/state/cockpit/worktrees</code><br>Companions <code>~/.local/state/cockpit/companions</code><br>State <code>~/.local/state/cockpit/operations</code></p></details><details class="warning"><summary>Repository discovery entry limit reached</summary><p><code>catalog_entries_bounded</code> · 2 occurrences<br><code>/home/nnex/dev/prj/cockpit</code></p></details>`}
function repoResult(){return 'cockpit /home/nnex/dev/prj/cockpit'.includes(query.toLowerCase())?`<div class="repository"><strong>cockpit</strong><code>/home/nnex/dev/prj/cockpit</code><span class="branch">main</span></div>`:`<div class="empty">No matching repositories.</div>`}
function stepContent(){if(step===0)return repositoryStep();if(step===1)return `<label class="option"><input type="radio" name="worktree" checked> Create a separate task worktree</label><label class="option"><input type="radio" name="worktree"> Open the existing checkout</label><label class="field"><span>Base branch</span><input value="main"></label>`;if(step===2)return `<label class="option"><input type="checkbox" checked> Create a companion context directory</label><label class="field"><span>Artifact URL <em>optional</em></span><input placeholder="Issue or review URL"></label><details><summary>Context location</summary><p><code>~/.local/state/cockpit/companions</code></p></details>`;return `<dl class="summary-grid"><dt>Repository</dt><dd>cockpit</dd><dt>Checkout</dt><dd><code>/home/nnex/dev/prj/cockpit</code></dd><dt>Task name</dt><dd>${esc(taskName)||'Not specified'}</dd><dt>Session</dt><dd>default</dd></dl><details class="warning"><summary>Repository discovery entry limit reached</summary><p><code>catalog_entries_bounded</code></p></details>`}
function modal(){return `<div class="modal-host" ${dialogOpen?'':'hidden'}><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="setup-title"><header class="dialog-header"><h1 id="setup-title">Set up a workspace</h1><button class="close" data-action="close" aria-label="Close workspace preview">Close</button></header><nav class="steps" aria-label="Setup step">${['Repository','Worktree','Context','Review'].map((n,i)=>`<button data-step="${i}" class="${step===i?'current':''}" ${step===i?'aria-current="step"':''}><span>${i+1}</span>${n}</button>`).join('')}</nav><div class="dialog-body">${stepContent()}</div><footer class="dialog-footer"><span class="footnote">Session <code>default</code></span>${step?'<button class="control quiet" data-action="back">Back</button>':'<button class="control quiet" data-action="close">Cancel</button>'}<button class="control primary" data-action="next" ${step===3?'disabled title="Visual study only. No resources will be created."':''}>${step===3?'Preview only':'Continue'}</button></footer></section></div>`}
function render(){artboard.dataset.theme=theme;artboard.classList.toggle('show-original',original);artboard.innerHTML=rail()+tabs()+(scene==='files'?files():review())+modal()+`<img class="original" src="assets/${scene}-original.png" alt="Original supplied ${scene} screenshot">`;document.querySelector('.themes').innerHTML=Object.entries(designs).map(([k,v])=>`<button data-theme-choice="${k}" title="${v.description}" aria-pressed="${k===theme}">${v.name}</button>`).join('');document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelector('#original-toggle').setAttribute('aria-pressed',String(original));document.querySelector('#original-toggle').textContent=original?'Back to design':'Show original';history.replaceState(null,'',`?theme=${theme}&scene=${scene}`);const filter=document.querySelector('#repo-search');if(filter)filter.oninput=()=>{query=filter.value;document.querySelector('#repo-result').innerHTML=repoResult()};const name=document.querySelector('#task-name');if(name)name.oninput=()=>taskName=name.value;resize()}
function resize(){const v=document.querySelector('.viewport').getBoundingClientRect();artboard.style.transform=`translate(-50%,-50%) scale(${Math.min(v.width/1568,v.height/992)})`}
function focusDialog(){requestAnimationFrame(()=>document.querySelector('.dialog .close')?.focus({preventScroll:true}))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.themeChoice){theme=b.dataset.themeChoice;render();return}if(b.dataset.scene){scene=b.dataset.scene;dialogOpen=scene==='workspace';original=false;render();return}if(b.id==='original-toggle'){original=!original;render();return}if(b.dataset.file!==undefined){selectedFile=Number(b.dataset.file);render();return}if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();focusDialog();return}switch(b.dataset.action){case'open':returnFocus=b;dialogOpen=true;render();focusDialog();break;case'close':dialogOpen=false;render();document.querySelector('[data-action=open]')?.focus();break;case'next':step=Math.min(3,step+1);render();focusDialog();break;case'back':step=Math.max(0,step-1);render();focusDialog();break;case'source':source=true;render();break;case'markdown':source=false;render();break;case'refresh':b.textContent='Static sample';setTimeout(()=>{if(b.isConnected)b.textContent='Refresh'},1400);break;case'diagnostics':dialogOpen=true;step=0;render();document.querySelector('.dialog details.warning').open=true;focusDialog();break}});
document.addEventListener('keydown',e=>{if(!dialogOpen||original)return;if(e.key==='Escape'){dialogOpen=false;render();document.querySelector('[data-action=open]')?.focus();return}if(e.key==='Tab'&&e.target.closest('.dialog')){const list=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog summary')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('resize',resize);render();
</script>
</body>
