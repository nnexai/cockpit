const filenames=['.agents','.omp','crates','dist','node_modules','planning','quality','research','scripts','src','src-tauri','target','.editorconfig','.gitignore','BOOTSTRAP_PLAN.md','CODE_GUIDE.md','CONTEXT.md','Cargo.lock','Cargo.toml','DECISIONS.md','IMPLEMENTATION_HANDOFF.md','NEXT_PHASE_PLAN.md','bun.lock','index.html','package.json','rust-toolchain.toml','tsconfig.json','vite.config.ts'];
const documentHTML=`<h1>Cockpit Architecture Context</h1><p><span class="muted">Status: architecture reference.</span> The Herdr client, reviewed worktree setup, companion association, and bounded graphical Context source/Markdown browsing are implemented. Media rendering, reference comments/paste, repository snapshots, source ingestion, and graphical review remain planned in <code>planning/next-level/README.md</code>. Verified delivery boundaries are recorded in <code>DECISIONS.md</code>.</p><p>All filesystem roots, executable locations, Herdr endpoints, and provider settings are configurable. Example absolute paths are intentionally omitted.</p><h2>1. Product vision</h2><p>Cockpit is a personal, local-first developer cockpit for supervising persistent coding-agent sessions and organizing the context needed to work on bounded engineering tasks.</p><p>The product is optimized for one developer on a trusted workstation. It is not a multi-tenant service and does not make coding agents autonomous background operators.</p><p>Cockpit follows conventional engineering workflows:</p><ul><li>discover a local repository;</li><li>create or open a task worktree;</li><li>attach a companion context directory;</li><li>supervise persistent Herdr sessions and agent terminals;</li><li>gather static issue, review, wiki, and telemetry context;</li><li>inspect, test, and review changes locally;</li><li>destroy owned workspace resources when the task is complete.</li></ul><p>Cockpit is intended to become the developer's primary way of engaging with local projects. Maintainable code and easy behavior changes matter more than distribution or product generality.</p><h2>2. Product domains</h2><p>Cockpit remains one umbrella product with provider-neutral domains:</p><ul><li><strong>Forge</strong> covers repositories, branches, pull/merge requests, review material, and worktree provenance.</li><li><strong>Issue Tracker</strong> covers issues, comments, labels, parent relationships, references, and freshness checks.</li><li><strong>Wiki</strong> covers pages and related documentation fetched as static context.</li><li><strong>Telemetry</strong> is optional static log and trace context when a provider adapter is added.</li><li><strong>Herdr Client</strong> is a richer graphical client for Herdr sessions, intended to feel like the native TUI.</li></ul><h2>3. Runtime architecture</h2><h3>3.1 Shared core</h3><p>The reusable Cockpit core and CLI are implemented in Rust. Herdr owns the live session and pane layout.</p>`;
function files(){return `<section class="pane file-pane" aria-label="File pane"><div class="toolbar"><strong>cockpit</strong><span class="badge">Read-only</span><span class="spacer"></span><button class="control quiet" data-action="refresh">Refresh</button><button class="control" disabled title="Terminal switching is not connected in this study">Show terminal</button></div><div class="notice"><span>!</span><span>Repository discovery limit reached. Some entries may be missing.</span><button data-action="diagnostics">Details · 2 occurrences</button></div><div class="file-tree"><div class="minihead">Files <span>cockpit</span></div>${filenames.map((f,i)=>`<div class="file-row ${f==='CONTEXT.md'?'selected':''}" title="${f}"><span>${i<12?'›':'·'}</span><span style="overflow:hidden;text-overflow:ellipsis">${f}</span>${i>11?`<span class="size">${i===16?'24.8K':i%2?'1.3K':'208B'}</span>`:''}</div>`).join('')}</div><div class="document"><div class="document-top">CONTEXT.md <span>24.8 KB · read-only snapshot</span></div><div class="document-actions"><button class="control ${source?'chosen':''}" data-action="source">Source</button><button class="control ${!source?'chosen':''}" data-action="markdown">Markdown</button></div>${source?`<div class="source-content">${esc('# Cockpit Architecture Context\n\nStatus: architecture reference.\n\n## 1. Product vision\n\nCockpit is a personal, local-first developer cockpit for supervising persistent coding-agent sessions and organizing the context needed to work on bounded engineering tasks.\n\nThe product is optimized for one developer on a trusted workstation.\n\nCockpit follows conventional engineering workflows:\n\n- discover a local repository;\n- create or open a task worktree;\n- attach a companion context directory;\n- supervise persistent Herdr sessions and agent terminals;\n- gather static issue, review, wiki, and telemetry context;\n- inspect, test, and review changes locally;\n- destroy owned workspace resources when the task is complete.\n\n## 2. Product domains\n\nForge, Issue Tracker, Wiki, Telemetry, and Herdr Client.\n\n## 3. Runtime architecture\n\nThe reusable Cockpit core and CLI are implemented in Rust.')}</div>`:`<article>${documentHTML}</article>`}</div><div class="pane-footer"><span>Read-only design sample</span><span>C comment</span><span>Shift+C file</span><span>0 comments</span></div></section>`}
function repositoryStep(){return `<h2>Choose a local repository</h2><p>Use a configured checkout. Remote URLs do not clone a repository.</p><label class="field"><span>Find repository</span><input id="repo-search" placeholder="Name or path" value="${esc(query)}" autocomplete="off"></label><div id="repo-result">${repoResult()}</div><label class="field"><span>Task name <em>optional</em></span><input id="task-name" placeholder="Short task description" value="${esc(taskName)}"></label><details><summary>Configured roots <span class="muted">· 4 paths</span></summary><p>Repositories <code>/home/nnex/dev/prj/cockpit</code><br>Worktrees <code>~/.local/state/cockpit/worktrees</code><br>Companions <code>~/.local/state/cockpit/companions</code><br>State <code>~/.local/state/cockpit/operations</code></p></details><details class="warning"><summary>Discovery limit reached <span>· 2 occurrences</span></summary><p>Repository discovery stopped at its configured entry limit. The selected repository remains available; the catalog may be incomplete.</p><p><code>catalog_entries_bounded · /home/nnex/dev/prj/cockpit</code><br>Both reported diagnostics refer to this root. This study groups their presentation; it does not repair discovery.</p></details>`}
function repoResult(){return 'cockpit /home/nnex/dev/prj/cockpit'.includes(query.toLowerCase())?`<div class="repository"><strong>cockpit</strong><span class="repo-check">Selected ✓</span><code>/home/nnex/dev/prj/cockpit</code><span class="branch">main · local repository</span></div>`:`<div class="empty">No matching repositories. Try “cockpit”.</div>`}
function stepContent(){if(step===0)return repositoryStep();if(step===1)return `<h2>Worktree</h2><p>Choose how this task would use the selected repository.</p><label class="option"><input type="radio" name="worktree" checked> Create a separate task worktree</label><label class="option"><input type="radio" name="worktree"> Open the existing checkout</label><label class="field"><span>Base branch</span><input value="main"></label><div class="preview-note">Local interaction preview only. No branch or worktree is created.</div>`;if(step===2)return `<h2>Companion context</h2><p>Keep task references separate from the working checkout.</p><label class="option"><input type="checkbox" checked> Create a companion context directory</label><label class="field"><span>Artifact URL <em>optional</em></span><input placeholder="Issue or review URL"></label><details><summary>Context location</summary><p><code>~/.local/state/cockpit/companions</code></p></details><div class="preview-note">Provider downloads and filesystem actions are not connected in this study.</div>`;return `<h2>Review workspace setup</h2><p>This is the final step of the visual prototype.</p><dl class="summary-grid"><dt>Repository</dt><dd>cockpit</dd><dt>Checkout</dt><dd><code>/home/nnex/dev/prj/cockpit</code></dd><dt>Task name</dt><dd>${esc(taskName)||'Not specified'}</dd><dt>Herdr session</dt><dd>default · reference only</dd></dl><div class="preview-note">Worktree and Context controls demonstrate layout only. This preview does not submit configuration or create resources.</div><details class="warning"><summary>Discovery warning remains</summary><p>The repository catalog reached its configured entry limit.</p></details>`}
function modal(){return `<div class="modal-host" ${dialogOpen?'':'hidden'}><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="setup-title"><header class="dialog-header"><div><h1 id="setup-title">Set up a workspace</h1><p>A local repository, a task worktree, and its context.</p></div><button class="close" data-action="close" aria-label="Close workspace preview">×</button></header><nav class="steps" aria-label="Setup step">${['Repository','Worktree','Context','Review'].map((n,i)=>`<button data-step="${i}" class="${step===i?'current':''}" ${step===i?'aria-current="step"':''}><span>0${i+1}</span>${n}</button>`).join('')}</nav><div class="dialog-body">${stepContent()}</div><footer class="dialog-footer"><span class="footnote">Design preview. Nothing is created or changed in Herdr.</span>${step?'<button class="control quiet" data-action="back">Back</button>':'<button class="control quiet" data-action="close">Cancel</button>'}<button class="control primary" data-action="next" ${step===3?'disabled':''}>${step===3?'Preview only':`Continue <span>→</span>`}</button></footer></section></div>`}
function render(){artboard.dataset.theme=theme;artboard.classList.toggle('show-original',original);artboard.innerHTML=rail()+tabs()+(scene==='files'?files():review())+modal()+`<img class="original" src="assets/${scene}-original.png" alt="Original supplied ${scene} screenshot">`;document.querySelector('.themes').innerHTML=Object.entries(designs).map(([k,v])=>`<button data-theme-choice="${k}" aria-pressed="${k===theme}">${v.name}</button>`).join('');document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelector('#design-name').textContent=designs[theme].name;document.querySelector('#design-caption').textContent=designs[theme].description;document.querySelector('#original-toggle').setAttribute('aria-pressed',String(original));document.querySelector('#original-toggle').textContent=original?'Back to design':'Show original';history.replaceState(null,'',`?theme=${theme}&scene=${scene}`);const filter=document.querySelector('#repo-search');if(filter)filter.oninput=()=>{query=filter.value;document.querySelector('#repo-result').innerHTML=repoResult()};const name=document.querySelector('#task-name');if(name)name.oninput=()=>taskName=name.value;resize()}
function resize(){const v=document.querySelector('.viewport').getBoundingClientRect();artboard.style.transform=`translate(-50%,-50%) scale(${Math.min(v.width/1568,v.height/992)})`}
function focusDialog(){requestAnimationFrame(()=>document.querySelector('.dialog .close')?.focus({preventScroll:true}))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.themeChoice){theme=b.dataset.themeChoice;render();return}if(b.dataset.scene){scene=b.dataset.scene;dialogOpen=scene==='workspace';original=false;render();return}if(b.id==='original-toggle'){original=!original;render();return}if(b.dataset.file!==undefined){selectedFile=Number(b.dataset.file);render();return}if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();focusDialog();return}switch(b.dataset.action){case'open':returnFocus=b;dialogOpen=true;render();focusDialog();break;case'close':dialogOpen=false;render();document.querySelector('[data-action=open]')?.focus();break;case'next':step=Math.min(3,step+1);render();focusDialog();break;case'back':step=Math.max(0,step-1);render();focusDialog();break;case'source':source=true;render();break;case'markdown':source=false;render();break;case'refresh':b.textContent='Static sample';setTimeout(()=>{if(b.isConnected)b.textContent='Refresh'},1400);break;case'diagnostics':dialogOpen=true;step=0;render();document.querySelector('.dialog details.warning').open=true;focusDialog();break}});
document.addEventListener('keydown',e=>{if(!dialogOpen||original)return;if(e.key==='Escape'){dialogOpen=false;render();document.querySelector('[data-action=open]')?.focus();return}if(e.key==='Tab'&&e.target.closest('.dialog')){const list=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog summary')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('resize',resize);render();
