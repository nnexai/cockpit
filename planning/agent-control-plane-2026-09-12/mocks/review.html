<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Cockpit UI proposals</title><link rel="icon" href="data:,">
  <style>
    :root{color-scheme:dark;font:14px system-ui,sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#0b0e13;color:#e6eaf0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#1b222d;border-bottom:1px solid #3b4758}header strong{font-weight:500}label{display:flex;align-items:center;gap:6px;font-size:13px}select{font:inherit;background:#11151c;color:inherit;border:1px solid #3b4758;border-radius:3px;padding:5px}a{color:#8db8ff}p{margin:0;padding:10px 16px;color:#a7b0be;font-size:12px}main{padding:0 16px 16px;overflow:auto}iframe{display:block;border:0;outline:1px solid #3b4758;background:#0c1016}select:focus-visible,a:focus-visible{outline:2px solid #8db8ff;outline-offset:2px}
  </style>
</head>
<body>
  <header><strong>Cockpit proposals</strong><label>Surface <select id="surface"><option value="shell">Shell</option><option value="context">Files &amp; Context</option><option value="review">Review</option><option value="setup">Space setup</option><option value="feedback">Browser feedback</option><option value="capture">Browser capture</option></select></label><label>Size <select id="size"><option>1440×900</option><option>800×1000</option><option>600×900</option><option>480×900</option></select></label><label id="direction-label">Shell <select id="direction"><option value="drawer">B · Drawer</option><option value="rail">A · Rail</option><option value="before">Atlas capture</option></select></label><a href="viewers.html">Compare viewers</a><a href="../README.md">12 task packets</a></header>
  <p>Discussion mockups only. The frame uses the selected size. Its controls act locally; terminal interiors use recorded atlas pixels.</p>
  <main><iframe id="frame" title="Cockpit UI discussion mock"></iframe></main>
  <script>
    const surface=document.querySelector('#surface'),size=document.querySelector('#size'),direction=document.querySelector('#direction'),frame=document.querySelector('#frame');
    function update(){const [width,height]=size.value.split('×').map(Number);frame.width=width;frame.height=height;document.querySelector('#direction-label').hidden=surface.value!=='shell';frame.src=surface.value==='shell'?'index.html?capture=1&direction='+direction.value:'surfaces.html?surface='+surface.value;}
    for(const select of [surface,size,direction])select.addEventListener('change',update);update();
  </script>
</body>
</html>
