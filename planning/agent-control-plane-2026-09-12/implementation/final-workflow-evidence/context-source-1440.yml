                  - code [ref=e687]
                - row [ref=e689] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e690]: "91"
                  - code [ref=e691]: "- `lineHeight: 1` is the change that fixes the vertical cell pitch. It brought the repeated OMP separator rows from the previous roughly 113 px rhythm down to the Herdr-like roughly 88–90 px rhythm. Canvas is not required for that spacing correction."
                - row [ref=e693] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e694]: "92"
                  - code [ref=e695]: "- Canvas was a separate glyph-rasterization experiment intended to improve box-drawing junction/endpoint continuity. The DOM renderer with `lineHeight: 1` already had the corrected vertical rhythm; the remaining question was only whether Canvas made the horizontal rule edges look closer at zoom."
                - row [ref=e697] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e698]: "93"
                  - code [ref=e699]
                - row [ref=e701] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e702]: "94"
                  - code [ref=e703]: "Current implementation (`58240ed`) uses Canvas plus `lineHeight: 1`. A native macOS smoke with continuous output stayed rendered for 60 seconds, but `@xterm/addon-canvas@0.8.0-beta.48` declares an xterm 5 peer while Cockpit uses xterm 6. An earlier Canvas attempt caused a blank native terminal after several seconds and was removed in `f94d786`; the current pairing did not reproduce that blanking during the smoke."
                - row [ref=e705] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e706]: "95"
                  - code [ref=e707]
                - row [ref=e709] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e710]: "96"
                  - code [ref=e711]: "Conclusion: Canvas is not necessary to fix the reported cell-spacing drift. It is only justified if the exact zoomed box-drawing glyph continuity is judged better than the DOM renderer. The minimal fix is the font/cell metrics plus `lineHeight: 1`; Canvas remains a compatibility-risk tradeoff rather than a spacing requirement."
